<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyWebtel — film de présentation V6</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Medium.otf); font-weight: 500; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Bold.otf); font-weight: 700; }

/* V6 : un monde en 3D construit avec la vraie interface. Couleurs de la plateforme : barre latérale #06213e → #041b34,
   bleu #008ff1, cyan #05daf0, fond #f1f7fd, encre #08264b. */
:root { --navy: #06213e; --navy2: #041b34; --ink: #08264b; --muted: #647b9b; --blue: #008ff1; --cyan: #05daf0; --line: #dfe9f4; --bg: #f1f7fd;
        --green: #129266; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; }
canvas.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
#viewport { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 960px 540px; pointer-events: none; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0 0; transform-style: preserve-3d; }
#world > * { position: absolute; left: 0; top: 0; transform-origin: 0 0 0; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { position: absolute; left: 0; top: 0; }
#grade { position: absolute; inset: 0; pointer-events: none; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* tuiles : une page réelle par iframe, posée dans le monde */
.tile { width: 1440px; height: 900px; border-radius: 16px; overflow: hidden; background: var(--bg);
        box-shadow: 0 0 0 1px rgba(8,38,75,.10); }
.tile iframe, .clip iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; pointer-events: none; }
.clip { overflow: hidden; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px rgba(8,38,75,.10); }
.dim { position: absolute; inset: 0; background: #041b34; pointer-events: none; }
.shadow { border-radius: 30px; background: rgba(8,38,75,.42); filter: blur(34px); }
.halo { border-radius: 40px; filter: blur(46px);
        background: conic-gradient(from 0deg, rgba(5,218,240,.0), rgba(5,218,240,.85), rgba(0,143,241,.95), rgba(0,120,248,.35), rgba(5,218,240,.0), rgba(5,218,240,.7), rgba(5,218,240,0)); }

/* étiquettes du plan (pastilles sombres façon pub) */
.label { display: flex; align-items: center; gap: 18px; padding: 18px 30px 18px 18px; border-radius: 22px; white-space: nowrap;
         background: rgba(6,33,62,.94); color: #fff; font: 600 40px "Inter"; box-shadow: 0 24px 60px rgba(4,27,52,.35), inset 0 0 0 1px rgba(255,255,255,.12); }
.label .ic { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; color: #fff;
             background: linear-gradient(145deg, #05daf0, #008ff1); }

/* textes clés (tapés mot à mot, le mot fort en bleu) */
.kw { white-space: nowrap; font: 500 72px "InterDisplay", "Inter"; letter-spacing: -0.025em; color: var(--ink); }
.kw.night { color: #eef6ff; }
.kw span { display: inline-block; margin-right: 0.24em; }
.kw b { font-weight: 600; color: var(--blue); }
.kw.night b { color: var(--cyan); }
.kw .caret { display: inline-block; width: 6px; height: 0.9em; background: currentColor; vertical-align: -0.1em; margin-left: 2px; }
.big { white-space: nowrap; font: 700 260px "InterDisplay"; letter-spacing: -0.04em; color: #fff; font-variant-numeric: tabular-nums; }

/* cartes en verre de l'ouverture */
.task { display: flex; align-items: center; gap: 22px; padding: 24px 34px 24px 24px; border-radius: 28px; white-space: nowrap;
        background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); color: #eef6ff; font: 600 40px "Inter";
        box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(160,230,255,.28); }
.task .ic { width: 78px; height: 78px; border-radius: 22px; display: grid; place-items: center; font-size: 40px; color: #fff;
            background: linear-gradient(145deg, #05daf0, #008ff1); box-shadow: 0 0 40px rgba(5,218,240,.55); }
.task small { display: block; font: 500 27px "Inter"; color: rgba(225,240,255,.66); margin-top: 4px; }

/* papier (« imprimer, signer, scanner ») */
.paper { width: 760px; height: 1000px; background: #fff; border-radius: 6px; padding: 70px 76px; font-family: "Inter";
         box-shadow: 0 50px 120px rgba(4,27,52,.35), 0 0 0 1px rgba(8,38,75,.06); overflow: hidden; }
.paper h5 { font: 700 30px "Inter"; color: #0b2a4d; letter-spacing: .02em; }
.paper .l { height: 14px; border-radius: 7px; background: #e4ecf5; margin-top: 26px; }
.paper .scan { position: absolute; left: -40px; right: -40px; height: 90px; background: linear-gradient(180deg, rgba(5,218,240,0), rgba(5,218,240,.55), rgba(5,218,240,0)); }
.shard { overflow: hidden; }

/* e-mail du code */
.mailcard { width: 780px; padding: 34px 40px; border-radius: 30px; background: rgba(255,255,255,.96); color: var(--ink); font-family: "Inter";
            box-shadow: 0 50px 120px rgba(4,27,52,.30), inset 0 0 0 1.5px rgba(223,233,244,.95); }
.mailcard .from { display: flex; align-items: center; gap: 16px; font-size: 24px; color: var(--muted); }
.mailcard .from i { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(145deg, #05daf0, #008ff1); color: #fff; font-style: normal; font: 700 28px "Inter"; }
.mailcard h4 { font-size: 30px; margin: 18px 0 8px; }
.mailcard p { font-size: 24px; color: #3b5576; line-height: 1.45; }
.mailcard .code { display: inline-flex; gap: 10px; margin-top: 18px; }
.mailcard .code span { width: 74px; height: 92px; border-radius: 16px; background: #eef6ff; display: grid; place-items: center; font: 700 56px "InterDisplay"; color: var(--blue); }

/* fichier justificatif */
.pdf { width: 300px; height: 380px; border-radius: 22px; background: #fff; padding: 30px; font-family: "Inter";
       box-shadow: 0 40px 90px rgba(4,27,52,.30), inset 0 0 0 1.5px rgba(223,233,244,.95); }
.pdf .tag { display: inline-block; padding: 6px 14px; border-radius: 10px; background: #ce364a; color: #fff; font: 700 24px "Inter"; }
.pdf .l { height: 12px; border-radius: 6px; background: #e4ecf5; margin-top: 18px; }
.pdf b { display: block; margin-top: 26px; font: 600 22px "Inter"; color: var(--ink); }

/* frise d'ancienneté */
.rule { width: 980px; padding: 34px 44px 40px; border-radius: 30px; background: rgba(255,255,255,.96); font-family: "Inter";
        box-shadow: 0 40px 100px rgba(4,27,52,.22), inset 0 0 0 1.5px rgba(223,233,244,.95); }
.rule .bar { position: relative; height: 16px; border-radius: 8px; background: #e4ecf5; margin: 64px 10px 18px; }
.rule .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: linear-gradient(90deg, #008ff1, #05daf0); }
.rule .knob { position: absolute; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: #fff; display: grid; place-items: center;
              box-shadow: 0 10px 30px rgba(4,27,52,.25); font-size: 32px; color: var(--blue); }
.rule .ticks { display: flex; justify-content: space-between; font: 600 26px "Inter"; color: var(--muted); }
.rule .ticks b { color: var(--ink); }

/* orbe de l'agent */
.orb { width: 300px; height: 300px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 150px;
       background: radial-gradient(circle, rgba(140,245,255,.85) 0%, rgba(5,218,240,.55) 22%, rgba(0,143,241,.22) 48%, rgba(0,143,241,0) 70%); }
.orb svg { stroke-width: 1.5; filter: drop-shadow(0 0 18px rgba(5,218,240,.95)) drop-shadow(0 0 40px rgba(0,143,241,.8)); }
/* HUD : curseur, pastilles ✓, notification */
.cursor { width: 34px; height: 44px; z-index: 50; filter: drop-shadow(0 6px 12px rgba(0,0,0,.30)); }
.ripple { width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 3px solid rgba(0,143,241,.65); }
.check { display: flex; align-items: center; gap: 16px; padding: 18px 30px 18px 18px; border-radius: 18px; white-space: nowrap;
         background: rgba(6,33,62,.92); color: #fff; font: 600 30px "Inter"; box-shadow: 0 24px 60px rgba(4,27,52,.35), inset 0 0 0 1px rgba(255,255,255,.14); }
.check .ok { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); display: grid; place-items: center; font-size: 26px; color: #fff; }
.bars { position: absolute; left: 0; right: 0; height: 140px; background: #000; }
.grain { position: absolute; inset: -64px; opacity: .05; mix-blend-mode: soft-light; }
.vignette { position: absolute; inset: 0; background: radial-gradient(1500px 1000px at 50% 50%, rgba(0,0,0,0) 55%, rgba(2,12,26,.55) 100%); }
.flash { position: absolute; inset: 0; background: #fff; }
.tagline { white-space: nowrap; font: 700 34px "Inter"; letter-spacing: .36em; color: #8fb3d6; }
.tagline span { display: inline-block; }
.subline { white-space: nowrap; font: 500 34px "Inter"; color: rgba(225,240,255,.82); letter-spacing: .02em; }
.subline i { font-style: normal; color: var(--cyan); padding: 0 .5em; }

/* V7 : appareils (vraie interface responsive dans chaque écran) */
.dev { transform-style: flat; }
.scr { position: absolute; overflow: hidden; background: #f1f7fd; }
.scr iframe { position: absolute; left: 0; top: 0; border: 0; pointer-events: none; }
.phone { width: 430px; height: 884px; border-radius: 70px;
         background: linear-gradient(145deg, #3a414c 0%, #0c1017 35%, #0c1017 65%, #2a313b 100%);
         box-shadow: inset 0 0 0 2px #5b6472, inset 0 0 0 6px #0b0f16, 0 70px 140px rgba(4,27,52,.45), 0 20px 40px rgba(4,27,52,.25); }
.phone .scr { left: 20px; top: 20px; width: 390px; height: 844px; border-radius: 52px; }
.phone .island { position: absolute; left: 155px; top: 31px; width: 120px; height: 35px; border-radius: 20px; background: #05070b; z-index: 3; }
.phone .btn { position: absolute; width: 5px; border-radius: 3px; background: #2f3640; }
.tablet { width: 880px; height: 1240px; border-radius: 60px;
          background: linear-gradient(145deg, #3a414c 0%, #0c1017 30%, #0c1017 70%, #2a313b 100%);
          box-shadow: inset 0 0 0 2px #5b6472, inset 0 0 0 7px #0b0f16, 0 70px 140px rgba(4,27,52,.45), 0 20px 40px rgba(4,27,52,.25); }
.tablet .scr { left: 30px; top: 30px; width: 820px; height: 1180px; border-radius: 30px; }
.tablet .cam { position: absolute; left: 434px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #1b2330; }
.lid { width: 1530px; height: 990px; border-radius: 34px 34px 14px 14px;
       background: linear-gradient(180deg, #1a1f27, #0b0f15); box-shadow: inset 0 0 0 2px #3b4350, 0 60px 130px rgba(4,27,52,.40); }
.lid .scr { left: 45px; top: 42px; width: 1440px; height: 900px; border-radius: 6px; }
.lid .cam { position: absolute; left: 760px; top: 17px; width: 10px; height: 10px; border-radius: 50%; background: #2a3140; }
.base { width: 1800px; height: 1060px; border-radius: 12px 12px 46px 46px;
        background: linear-gradient(180deg, #c9d1db 0%, #e3e8ee 8%, #d4dae2 100%); box-shadow: inset 0 0 0 2px #aeb7c3; }
.base .kb { position: absolute; left: 190px; top: 70px; width: 1420px; height: 520px; border-radius: 18px; background:
            repeating-linear-gradient(90deg, #1b2029 0 82px, #2a303a 82px 92px), #1b2029; opacity: .92; }
.base .pad { position: absolute; left: 640px; top: 650px; width: 520px; height: 330px; border-radius: 22px; background: #c5ccd6; box-shadow: inset 0 0 0 2px #b0b8c4; }
.notif { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 5; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 26px;
         background: rgba(245,248,252,.94); box-shadow: 0 18px 40px rgba(4,27,52,.28); font-family: "Inter"; color: #08264b; }
.notif i { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, #05daf0, #008ff1); color: #fff; font: 700 22px "Inter"; font-style: normal; flex: none; }
.notif b { display: block; font-size: 15px; } .notif span { font-size: 14px; color: #3b5576; } .notif strong { color: #008ff1; letter-spacing: .08em; }
.slam { white-space: nowrap; font: 700 150px "InterDisplay", "Inter"; letter-spacing: -0.035em; line-height: 1; color: #fff; }
.slam.ink { color: #08264b; }
.slam b { font-weight: 700; color: var(--cyan); } .slam.ink b { color: var(--blue); }
.slam.sm { font-size: 104px; }
.slam.vv b { color: #06213e; }
.slam .tile { display: inline-grid; place-items: center; width: 1.05em; height: 1.05em; border-radius: .26em; margin-right: .28em; vertical-align: -0.17em;
              background: linear-gradient(145deg, #05daf0, #008ff1); color: #fff; font-size: .8em; box-shadow: 0 0 60px rgba(5,218,240,.45); }
.slam .tile svg { width: .62em; height: .62em; stroke-width: 2.2; }
.touch { width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,255,255,.55); border: 4px solid rgba(0,143,241,.85); box-shadow: 0 8px 26px rgba(4,27,52,.35); }
.src { display: flex; align-items: center; gap: 18px; padding: 22px 30px 22px 22px; border-radius: 26px; white-space: nowrap; background: rgba(255,255,255,.95);
       font: 600 34px "Inter"; color: #08264b; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.src .ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; color: #fff; background: linear-gradient(145deg, #05daf0, #008ff1); }
.src small { display: block; font: 500 24px "Inter"; color: #647b9b; }

/* V8 : façon présentation Apple. Appareils en volume (couches empilées), verre, clavier ; typographie sobre. */
.d3 { transform-style: preserve-3d; }
.d3 > * { position: absolute; }
.lay { inset: 0; border-radius: inherit; }
.ph8 { width: 430px; height: 884px; border-radius: 72px; }
.ph8 .edge { background: linear-gradient(100deg, #6d7480 0%, #23272e 12%, #3b414b 50%, #1c2026 88%, #7a818d 100%); }
.ph8 .face { inset: 0; border-radius: 72px; background: #06070a; box-shadow: inset 0 0 0 3px #2b3038, inset 0 0 0 5px #0a0b0e; }
.ph8 .scr { left: 20px; top: 20px; width: 390px; height: 844px; border-radius: 52px; }
.ph8 .island { left: 155px; top: 31px; width: 120px; height: 35px; border-radius: 20px; background: #020203; z-index: 3; }
.tb8 { width: 880px; height: 1240px; border-radius: 62px; }
.tb8 .edge { background: linear-gradient(100deg, #6d7480 0%, #23272e 10%, #3b414b 50%, #1c2026 90%, #7a818d 100%); }
.tb8 .face { inset: 0; border-radius: 62px; background: #06070a; box-shadow: inset 0 0 0 3px #2b3038, inset 0 0 0 6px #0a0b0e; }
.tb8 .scr { left: 30px; top: 30px; width: 820px; height: 1180px; border-radius: 32px; }
.tb8 .cam { left: 435px; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: #1a2230; }
.lid8 { width: 1500px; height: 968px; border-radius: 30px 30px 10px 10px; }
.lid8 .back { background: linear-gradient(160deg, #d9dce1 0%, #b4b9c1 45%, #9aa0a9 100%); }
.lid8 .edge { background: #a9aeb6; }
.lid8 .face { inset: 0; border-radius: inherit; background: #050608; box-shadow: inset 0 0 0 2px #24282f; }
.lid8 .scr { left: 30px; top: 28px; width: 1440px; height: 900px; border-radius: 8px; }
.lid8 .cam { left: 746px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: #1a2230; box-shadow: 0 0 0 2px #0d0f13; }
.base8 { width: 1500px; height: 1010px; border-radius: 12px 12px 38px 38px; }
.base8 .deck { inset: 0; border-radius: inherit; background: linear-gradient(180deg, #8f959e 0%, #c4c8ce 3%, #d7dade 30%, #c9cdd3 100%); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.12); }
.base8 .side { background: linear-gradient(180deg, #7d838c, #9aa0a8 60%, #6b7079); }
.base8 .hinge { left: 150px; top: 0; width: 1200px; height: 15px; border-radius: 0 0 8px 8px; background: linear-gradient(180deg, #090a0c, #25282e); }
.base8 .well { left: 150px; top: 58px; width: 1200px; height: 452px; border-radius: 16px; background: #0c0d10; padding: 9px; display: flex; flex-direction: column; gap: 7px; box-shadow: inset 0 2px 5px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.35); }
.base8 .row { display: flex; gap: 7px; flex: 1; }
.base8 .row.fn { flex: .55; }
.base8 .key { flex: 1; border-radius: 8px; background: linear-gradient(180deg, #2a2c31, #1a1b1f); box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 1px 1px rgba(0,0,0,.6); }
.base8 .grille { top: 80px; width: 92px; height: 400px; border-radius: 8px; opacity: .55;
                 background-image: radial-gradient(circle, #6f757d 1.3px, transparent 1.6px); background-size: 7px 7px; }
.base8 .pad { left: 470px; top: 560px; width: 560px; height: 370px; border-radius: 18px; background: linear-gradient(180deg, #cfd3d8, #c3c7cd); box-shadow: inset 0 0 0 1.5px rgba(120,126,135,.55), inset 0 2px 4px rgba(255,255,255,.5); }
.base8 .lip { left: 650px; bottom: -1px; width: 200px; height: 9px; border-radius: 9px 9px 0 0; background: linear-gradient(180deg, #8d939b, #b9bdc4); }
.glass, .sheen, .off { position: absolute; }
.glass { inset: 0; pointer-events: none; z-index: 4; background: linear-gradient(125deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.02) 28%, rgba(255,255,255,0) 45%); }
.sheen { inset: 0; pointer-events: none; z-index: 5; background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.26) 50%, rgba(255,255,255,0) 62%); }
.off { inset: 0; pointer-events: none; z-index: 6; background: #000; }
.eyebrow { white-space: nowrap; font: 600 32px "Inter"; letter-spacing: .01em; color: #35c8f5; }
.head { white-space: nowrap; font: 600 98px "InterDisplay", "Inter"; letter-spacing: -0.032em; line-height: 1.05; color: #f5f7fa; }
.head.xl { font-size: 132px; }
.head.md { font-size: 78px; }
.head b { font-weight: 600; background: linear-gradient(90deg, #2f9bff 0%, #05daf0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head span.wd { display: inline-block; }
.head s { text-decoration: none; position: relative; }
.head s::after { content: ""; position: absolute; left: -6px; right: -6px; top: 56%; height: 6px; border-radius: 3px; background: #f5f7fa; transform-origin: left; transform: scaleX(var(--k, 0)); }
.cap { white-space: nowrap; font: 500 36px "Inter"; color: #f5f7fa; padding: 18px 34px; border-radius: 999px; background: rgba(18,24,34,.78);
       box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.14); }
.cap b { font-weight: 600; color: #5fd4ff; }
.chip8 { display: flex; align-items: center; gap: 18px; padding: 20px 30px 20px 20px; border-radius: 26px; white-space: nowrap; color: #f5f7fa; font: 600 32px "Inter";
  background: rgba(5,22,43,.94); border: 1.5px solid rgba(95,212,255,.55); box-shadow: 0 24px 60px rgba(0,8,24,.55), 0 0 34px rgba(5,218,240,.22); }
.chip8 .ic { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 32px; color: #fff; background: linear-gradient(145deg, #05daf0, #008ff1); }
.chip8 small { display: block; font: 500 23px "Inter"; color: rgba(225,240,255,.62); margin-top: 2px; }
.paper8 { width: 620px; height: 820px; background: #fff; border-radius: 8px; padding: 60px 62px; font-family: "Inter"; overflow: hidden; box-shadow: 0 0 120px rgba(90,170,255,.20), 0 40px 100px rgba(0,0,0,.6); }
.paper8 h5 { font: 700 25px "Inter"; color: #0b2a4d; letter-spacing: .02em; }
.paper8 .l { height: 12px; border-radius: 6px; background: #e4ecf5; margin-top: 22px; }
.paper8 .scan { position: absolute; left: -30px; right: -30px; height: 80px; background: linear-gradient(180deg, rgba(5,218,240,0), rgba(5,218,240,.6), rgba(5,218,240,0)); }
.aiglow { border-radius: 46px; filter: blur(34px); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="story8.js"></script>
</body>
</html>
