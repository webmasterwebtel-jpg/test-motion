<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyWebtel — film de présentation</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Medium.otf); font-weight: 500; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Bold.otf); font-weight: 700; }
/* l'application est en Arial (globals.css) : Liberation Sans a exactement les mêmes chasses */
@font-face { font-family: "AppSans"; src: url(fonts/LiberationSans-Regular.ttf); font-weight: 400; }
@font-face { font-family: "AppSans"; src: url(fonts/LiberationSans-Bold.ttf); font-weight: 700 900; }

/* charte réelle : app/globals.css (navy, ink, muted, line, bg, green, red) + bleu et gris du logo Webtel */
:root {
  --navy: #112d50; --ink: #061427; --muted: #66758a; --line: #dce3ec; --bg: #f4f7fb; --green: #16784a; --red: #b42318;
  --blue: #1a92f8; --grey: #50504c; --slate: #6078a0; --amber: #9a5b07;
  --night: #040d1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.layer { position: absolute; inset: 0; }
.center { position: absolute; left: 50%; top: 50%; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* --- fond et monde 3D */
#bg { position: absolute; inset: 0; }
#bgNight { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, #0d2747 0%, #071930 45%, #040d1a 80%); }
.glow { position: absolute; border-radius: 50%; filter: blur(90px); }
#view { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 50%; }
#world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform-style: preserve-3d; }

/* --- fenêtre de navigateur (générique) */
.win { position: absolute; left: 240px; top: 90px; width: 1440px; height: 900px; border-radius: 18px; background: #fff; overflow: hidden;
       box-shadow: 0 2px 0 rgba(255,255,255,.6) inset, 0 50px 120px rgba(6,20,39,.22), 0 12px 30px rgba(6,20,39,.10); border: 1px solid #d5dde8; }
.chrome { height: 52px; background: #eef2f7; border-bottom: 1px solid #dfe5ee; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.chrome i.d { width: 13px; height: 13px; border-radius: 50%; background: #cfd7e2; display: block; }
.url { margin-left: 22px; flex: 0 0 520px; height: 32px; border-radius: 10px; background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 14px;
       font: 15px "Inter"; color: #4d5b6e; }
.url svg { font-size: 15px; color: var(--green); }
.page { position: absolute; left: 0; top: 52px; right: 0; bottom: 0; background: var(--bg); overflow: hidden; }

/* --- application : reprise de globals.css (mêmes tailles, rayons et couleurs), police Arial */
.app { position: absolute; inset: 0; font-family: "AppSans", Arial, sans-serif; color: var(--ink); font-size: 16px; }
.app .cardL { width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 34px; box-shadow: 0 18px 50px rgba(17,45,80,.08); }
.app .eyebrow { font-size: 12px; letter-spacing: .12em; font-weight: 800; color: var(--muted); }
.app .title { font-size: 34px; line-height: 1.05; margin: 0 0 18px; font-weight: 700; }
.app .lead { color: var(--muted); line-height: 1.45; margin-bottom: 28px; }
.app .label { display: block; font-weight: 800; margin: 0 0 9px; }
.app .input { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 15px 14px; margin-bottom: 20px; min-height: 50px; background: #fff; position: relative; white-space: nowrap; }
.app .input.focus { border-color: #86a0bd; box-shadow: 0 0 0 3px rgba(17,45,80,.08); }
.app .caret { display: inline-block; width: 2px; height: 19px; background: var(--ink); vertical-align: -3px; margin-left: 1px; }
.app .btn { width: 100%; border: 0; border-radius: 13px; background: var(--navy); color: #fff; padding: 15px; font-weight: 800; text-align: center; position: relative; }
.app .btn.busy { background: #7c8ba0; }
.app .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
.app .small { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 26px 0 0; }
.app .shell { position: absolute; left: 50%; top: 0; width: 1120px; margin-left: -560px; padding: 28px 18px; }
.app .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
.app .brand { display: flex; gap: 14px; align-items: center; }
.app .brand img { height: 38px; display: block; }
.app .brand .sep { width: 1px; height: 30px; background: var(--line); }
.app .topactions { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.app .logout { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; color: var(--ink); }
.app .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
.app .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; position: relative; }
.app .panel h2 { margin: 0 0 8px; font-size: 22px; }
.app .muted { color: var(--muted); }
.app .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; margin: 12px 0 22px; }
.app .dot { width: 9px; height: 9px; border-radius: 50%; background: #8b98aa; }
.app .status.active .dot { background: var(--green); } .app .status.done .dot { background: var(--navy); } .app .status.pause .dot { background: #d08a12; }
.app .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
.app .metric { border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; }
.app .metric b { display: block; font-size: 25px; margin-top: 5px; }
.app .notice { border-radius: 12px; padding: 12px 14px; background: #fff8e6; color: #7a4b00; margin: 14px 0; }
.app .success { background: #ecfdf3; color: #176b42; } .app .danger { background: #fff1f0; color: #8f1d18; }
.app .secondaryGrid { display: grid; gap: 12px; }
.app .secondary { border: 1px solid var(--line); border-radius: 14px; padding: 15px; display: flex; align-items: center; gap: 14px; background: #fff; }
.app .secondary strong { display: block; margin-bottom: 5px; }
.app .secondary .ico { width: 40px; height: 40px; border-radius: 12px; background: #eef4fb; color: var(--navy); display: grid; place-items: center; font-size: 20px; flex: none; }
.app .secondary .chev { margin-left: auto; color: #9aa6b5; font-size: 18px; }
.app .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.app .pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; font-weight: 700; font-size: 13px; padding: 6px 11px; white-space: nowrap; }
.app .pill.amber { background: #fff8e6; color: #7a4b00; } .app .pill.green { background: #ecfdf3; color: #176b42; }
.app .pill.grey { background: #eef2f7; color: var(--muted); } .app .pill.blue { background: #e8f2fe; color: #0f5fae; } .app .pill.navy { background: var(--navy); color: #fff; }
.app .back { color: var(--muted); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.app .h1 { font-size: 28px; font-weight: 700; margin-bottom: 22px; }
.app .seg2 { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 13px; padding: 4px; margin-bottom: 20px; }
.app .seg2 div { text-align: center; padding: 11px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.app .seg2 div.on { background: var(--navy); color: #fff; }
.app .cal { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 20px; }
.app .cal .hd { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 10px; }
.app .cal .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 14px; }
.app .cal .days span { padding: 8px 0; border-radius: 9px; }
.app .cal .days .wd { color: var(--muted); font-size: 12px; font-weight: 800; }
.app .cal .days .sel { background: var(--navy); color: #fff; font-weight: 800; }
.app .cal .days .mid { background: #e8eef6; }
.app .chip { display: inline-flex; align-items: center; gap: 10px; border: 1px dashed #b8c4d4; border-radius: 12px; padding: 11px 14px; color: var(--muted); }
.app .chip.file { border-style: solid; color: var(--ink); background: #f7f9fc; }
.app .chip .pdf { width: 30px; height: 34px; border-radius: 6px; background: #fdeceb; color: var(--red); font-size: 10px; font-weight: 800; display: grid; place-items: center; }
.app .list .item { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.app .list .item:last-child { border-bottom: 0; }
.app .track { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.app .track i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; color: #fff; font-size: 13px; background: #fff; }
.app .track i.ok { background: var(--green); border-color: var(--green); }
.app .track i.now { border-color: #d08a12; }
.app .track b { flex: 1; height: 2px; background: var(--line); display: block; }
.app .modalBack { position: absolute; inset: 0; background: rgba(6,20,39,.32); }
.app .modal { position: absolute; left: 50%; top: 70px; width: 560px; margin-left: -280px; background: #fff; border-radius: 22px; padding: 30px; box-shadow: 0 40px 100px rgba(6,20,39,.3); }
.app .select { display: flex; justify-content: space-between; align-items: center; }
.app .doc { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: #fff; display: flex; flex-direction: column; gap: 12px; }
.app .doc .ft { width: 46px; height: 54px; border-radius: 9px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }

/* --- éléments de film (hors application) */
.cursor { position: absolute; left: 0; top: 0; width: 30px; height: 40px; z-index: 50; filter: drop-shadow(0 5px 10px rgba(0,0,0,.28)); }
.ripple { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 3px solid rgba(26,146,248,.65); z-index: 49; }
.clock { position: absolute; font-family: "InterDisplay"; color: var(--ink); }
.task { position: absolute; display: flex; align-items: center; gap: 16px; padding: 18px 24px 18px 18px; border-radius: 20px;
        background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #eef3fa; font: 600 26px "Inter"; white-space: nowrap;
        box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.task .ti { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: rgba(255,255,255,.1); }
.task small { display: block; font: 500 18px "Inter"; color: rgba(238,243,250,.6); margin-top: 3px; }
.tagline { font: 700 26px "Inter"; letter-spacing: .32em; color: var(--slate); white-space: nowrap; }
.note { position: absolute; display: flex; align-items: center; gap: 12px; font: 600 24px "Inter"; color: var(--ink); white-space: nowrap;
        padding: 14px 22px; border-radius: 999px; background: rgba(255,255,255,.85); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(6,20,39,.10); }
.note svg { font-size: 26px; }
.phone { position: absolute; width: 400px; height: 840px; border-radius: 64px; background: #0b1017; padding: 15px; box-shadow: 0 60px 120px rgba(6,20,39,.30); }
.phone .scr { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: var(--bg); position: relative; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
