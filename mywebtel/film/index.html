<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyWebtel — film de présentation V6</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Medium.otf); font-weight: 500; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Bold.otf); font-weight: 700; }

/* V6 : un monde en 3D construit avec la vraie interface. Couleurs de la plateforme : barre latérale #06213e → #041b34,
   bleu #008ff1, cyan #05daf0, fond #f1f7fd, encre #08264b. */
:root { --navy: #06213e; --navy2: #041b34; --ink: #08264b; --muted: #647b9b; --blue: #008ff1; --cyan: #05daf0; --line: #dfe9f4; --bg: #f1f7fd;
        --green: #129266; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #041b34; }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; }
canvas.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
#viewport { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 960px 540px; pointer-events: none; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0 0; transform-style: preserve-3d; }
#world > * { position: absolute; left: 0; top: 0; transform-origin: 0 0 0; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { position: absolute; left: 0; top: 0; }
#grade { position: absolute; inset: 0; pointer-events: none; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* tuiles : une page réelle par iframe, posée dans le monde */
.tile { width: 1440px; height: 900px; border-radius: 16px; overflow: hidden; background: var(--bg);
        box-shadow: 0 0 0 1px rgba(8,38,75,.10); }
.tile iframe, .clip iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; pointer-events: none; }
.clip { overflow: hidden; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px rgba(8,38,75,.10); }
.dim { position: absolute; inset: 0; background: #041b34; pointer-events: none; }
.shadow { border-radius: 30px; background: rgba(8,38,75,.42); filter: blur(34px); }
.halo { border-radius: 40px; filter: blur(46px);
        background: conic-gradient(from 0deg, rgba(5,218,240,.0), rgba(5,218,240,.85), rgba(0,143,241,.95), rgba(0,120,248,.35), rgba(5,218,240,.0), rgba(5,218,240,.7), rgba(5,218,240,0)); }

/* étiquettes du plan (pastilles sombres façon pub) */
.label { display: flex; align-items: center; gap: 18px; padding: 18px 30px 18px 18px; border-radius: 22px; white-space: nowrap;
         background: rgba(6,33,62,.94); color: #fff; font: 600 40px "Inter"; box-shadow: 0 24px 60px rgba(4,27,52,.35), inset 0 0 0 1px rgba(255,255,255,.12); }
.label .ic { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; color: #fff;
             background: linear-gradient(145deg, #05daf0, #008ff1); }

/* textes clés (tapés mot à mot, le mot fort en bleu) */
.kw { white-space: nowrap; font: 500 72px "InterDisplay", "Inter"; letter-spacing: -0.025em; color: var(--ink); }
.kw.night { color: #eef6ff; }
.kw span { display: inline-block; margin-right: 0.24em; }
.kw b { font-weight: 600; color: var(--blue); }
.kw.night b { color: var(--cyan); }
.kw .caret { display: inline-block; width: 6px; height: 0.9em; background: currentColor; vertical-align: -0.1em; margin-left: 2px; }
.big { white-space: nowrap; font: 700 260px "InterDisplay"; letter-spacing: -0.04em; color: #fff; font-variant-numeric: tabular-nums; }

/* cartes en verre de l'ouverture */
.task { display: flex; align-items: center; gap: 22px; padding: 24px 34px 24px 24px; border-radius: 28px; white-space: nowrap;
        background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); color: #eef6ff; font: 600 40px "Inter";
        box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(160,230,255,.28); }
.task .ic { width: 78px; height: 78px; border-radius: 22px; display: grid; place-items: center; font-size: 40px; color: #fff;
            background: linear-gradient(145deg, #05daf0, #008ff1); box-shadow: 0 0 40px rgba(5,218,240,.55); }
.task small { display: block; font: 500 27px "Inter"; color: rgba(225,240,255,.66); margin-top: 4px; }

/* papier (« imprimer, signer, scanner ») */
.paper { width: 760px; height: 1000px; background: #fff; border-radius: 6px; padding: 70px 76px; font-family: "Inter";
         box-shadow: 0 50px 120px rgba(4,27,52,.35), 0 0 0 1px rgba(8,38,75,.06); overflow: hidden; }
.paper h5 { font: 700 30px "Inter"; color: #0b2a4d; letter-spacing: .02em; }
.paper .l { height: 14px; border-radius: 7px; background: #e4ecf5; margin-top: 26px; }
.paper .scan { position: absolute; left: -40px; right: -40px; height: 90px; background: linear-gradient(180deg, rgba(5,218,240,0), rgba(5,218,240,.55), rgba(5,218,240,0)); }
.shard { overflow: hidden; }

/* e-mail du code */
.mailcard { width: 780px; padding: 34px 40px; border-radius: 30px; background: rgba(255,255,255,.96); color: var(--ink); font-family: "Inter";
            box-shadow: 0 50px 120px rgba(4,27,52,.30), inset 0 0 0 1.5px rgba(223,233,244,.95); }
.mailcard .from { display: flex; align-items: center; gap: 16px; font-size: 24px; color: var(--muted); }
.mailcard .from i { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(145deg, #05daf0, #008ff1); color: #fff; font-style: normal; font: 700 28px "Inter"; }
.mailcard h4 { font-size: 30px; margin: 18px 0 8px; }
.mailcard p { font-size: 24px; color: #3b5576; line-height: 1.45; }
.mailcard .code { display: inline-flex; gap: 10px; margin-top: 18px; }
.mailcard .code span { width: 74px; height: 92px; border-radius: 16px; background: #eef6ff; display: grid; place-items: center; font: 700 56px "InterDisplay"; color: var(--blue); }

/* fichier justificatif */
.pdf { width: 300px; height: 380px; border-radius: 22px; background: #fff; padding: 30px; font-family: "Inter";
       box-shadow: 0 40px 90px rgba(4,27,52,.30), inset 0 0 0 1.5px rgba(223,233,244,.95); }
.pdf .tag { display: inline-block; padding: 6px 14px; border-radius: 10px; background: #ce364a; color: #fff; font: 700 24px "Inter"; }
.pdf .l { height: 12px; border-radius: 6px; background: #e4ecf5; margin-top: 18px; }
.pdf b { display: block; margin-top: 26px; font: 600 22px "Inter"; color: var(--ink); }

/* frise d'ancienneté */
.rule { width: 980px; padding: 34px 44px 40px; border-radius: 30px; background: rgba(255,255,255,.96); font-family: "Inter";
        box-shadow: 0 40px 100px rgba(4,27,52,.22), inset 0 0 0 1.5px rgba(223,233,244,.95); }
.rule .bar { position: relative; height: 16px; border-radius: 8px; background: #e4ecf5; margin: 64px 10px 18px; }
.rule .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: linear-gradient(90deg, #008ff1, #05daf0); }
.rule .knob { position: absolute; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: #fff; display: grid; place-items: center;
              box-shadow: 0 10px 30px rgba(4,27,52,.25); font-size: 32px; color: var(--blue); }
.rule .ticks { display: flex; justify-content: space-between; font: 600 26px "Inter"; color: var(--muted); }
.rule .ticks b { color: var(--ink); }

/* orbe de l'agent */
.orb { width: 300px; height: 300px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 150px;
       background: radial-gradient(circle, rgba(140,245,255,.85) 0%, rgba(5,218,240,.55) 22%, rgba(0,143,241,.22) 48%, rgba(0,143,241,0) 70%); }
.orb svg { stroke-width: 1.5; filter: drop-shadow(0 0 18px rgba(5,218,240,.95)) drop-shadow(0 0 40px rgba(0,143,241,.8)); }
/* HUD : curseur, pastilles ✓, notification */
.cursor { width: 34px; height: 44px; z-index: 50; filter: drop-shadow(0 6px 12px rgba(0,0,0,.30)); }
.ripple { width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 3px solid rgba(0,143,241,.65); }
.check { display: flex; align-items: center; gap: 16px; padding: 18px 30px 18px 18px; border-radius: 18px; white-space: nowrap;
         background: rgba(6,33,62,.92); color: #fff; font: 600 30px "Inter"; box-shadow: 0 24px 60px rgba(4,27,52,.35), inset 0 0 0 1px rgba(255,255,255,.14); }
.check .ok { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); display: grid; place-items: center; font-size: 26px; color: #fff; }
.bars { position: absolute; left: 0; right: 0; height: 140px; background: #000; }
.grain { position: absolute; inset: -64px; opacity: .05; mix-blend-mode: soft-light; }
.vignette { position: absolute; inset: 0; background: radial-gradient(1500px 1000px at 50% 50%, rgba(0,0,0,0) 55%, rgba(2,12,26,.55) 100%); }
.flash { position: absolute; inset: 0; background: #fff; }
.tagline { white-space: nowrap; font: 700 34px "Inter"; letter-spacing: .36em; color: #8fb3d6; }
.tagline span { display: inline-block; }
.subline { white-space: nowrap; font: 500 34px "Inter"; color: rgba(225,240,255,.82); letter-spacing: .02em; }
.subline i { font-style: normal; color: var(--cyan); padding: 0 .5em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="story.js"></script>
</body>
</html>
