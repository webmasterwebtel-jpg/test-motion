<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyWebtel — film de présentation</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Medium.otf); font-weight: 500; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "InterDisplay"; src: url(fonts/InterDisplay-Bold.otf); font-weight: 700; }

/* film : couleurs de la plateforme réelle (barre latérale #06213e → #041b34, bleu #008ff1, cyan #05daf0, fond #f1f7fd) */
:root { --navy: #06213e; --navy2: #041b34; --ink: #08264b; --muted: #647b9b; --blue: #008ff1; --cyan: #05daf0; --line: #dfe9f4; --bg: #f1f7fd;
        --slate: #6078a0; --green: #129266; --red: #ce364a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.layer { position: absolute; inset: 0; }
.center { position: absolute; left: 50%; top: 50%; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#bg { position: absolute; inset: 0; background: radial-gradient(1500px 1000px at 50% 42%, #ffffff 0%, #f1f7fd 55%, #e4effb 100%); }
#bgNight { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, #0d385c 0%, #06213e 45%, #041b34 80%); }
#light { position: absolute; inset: 0; pointer-events: none; }
.glow { position: absolute; border-radius: 50%; filter: blur(90px); }
#view { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 50%; }
#world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform-style: preserve-3d; }

/* fenêtre de navigateur générique ; la page est la vraie interface (iframes) */
.win { position: absolute; left: 240px; top: 64px; width: 1440px; height: 952px; border-radius: 18px; background: #fff; overflow: hidden;
       box-shadow: 0 50px 120px rgba(4,27,52,.26), 0 12px 30px rgba(4,27,52,.12); border: 1px solid #d5dfeb; }
.chrome { height: 52px; background: #eef3f9; border-bottom: 1px solid #dde6f0; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.chrome i.d { width: 13px; height: 13px; border-radius: 50%; background: #cfd9e5; display: block; }
.url { margin-left: 22px; flex: 0 0 520px; height: 32px; border-radius: 10px; background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 14px;
       font: 15px "Inter"; color: #4d5b6e; }
.url svg { font-size: 15px; color: var(--green); }
.pg { position: absolute; left: 0; top: 52px; width: 1440px; height: 900px; border: 0; background: var(--bg); }
.probe { position: absolute; width: 2px; height: 2px; left: 0; top: 0; pointer-events: none; }

.cursor { position: absolute; left: 0; top: 0; width: 30px; height: 40px; z-index: 50; filter: drop-shadow(0 5px 10px rgba(0,0,0,.28)); }
.ripple { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 3px solid rgba(0,143,241,.6); z-index: 49; }
.focus { position: absolute; border-radius: 14px; border: 3px solid rgba(5,218,240,.9); box-shadow: 0 0 0 9999px rgba(4,27,52,0), 0 0 30px rgba(5,218,240,.45); z-index: 45; }
.task { position: absolute; display: flex; align-items: center; gap: 16px; padding: 18px 24px 18px 18px; border-radius: 20px;
        background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #eef3fa; font: 600 26px "Inter"; white-space: nowrap;
        box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.task .ti { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: linear-gradient(145deg, #04b6f2, #0078f8); }
.task small { display: block; font: 500 18px "Inter"; color: rgba(238,243,250,.62); margin-top: 3px; }
.tagline { font: 700 26px "Inter"; letter-spacing: .32em; color: var(--slate); white-space: nowrap; }
.note { position: absolute; display: flex; align-items: center; gap: 12px; font: 600 24px "Inter"; color: var(--ink); white-space: nowrap;
        padding: 14px 22px; border-radius: 999px; background: rgba(255,255,255,.9); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(4,27,52,.12); }
.note svg { font-size: 26px; color: var(--blue); }

/* V5 : textes clés (style Drive Academy), badges ✓, traits de lumière, e-mail du code, notifications */
.kin { position: absolute; left: 0; right: 0; text-align: center; font: 600 64px "InterDisplay", "Inter", sans-serif; letter-spacing: -0.02em; white-space: nowrap; }
.kin b { font-weight: 700; color: var(--cyan); }
.kin.dark { color: var(--ink); } .kin.dark b { color: var(--blue); }
.kin .caret { display: inline-block; width: 4px; height: 0.95em; background: currentColor; vertical-align: -0.12em; margin-left: 4px; }
.kin s { text-decoration: none; position: relative; }
.kin s::after { content: ""; position: absolute; left: -4px; right: -4px; top: 54%; height: 5px; border-radius: 3px; background: var(--cyan); transform-origin: left; transform: scaleX(var(--k, 0)); }
.kin .it { display: inline-flex; align-items: center; gap: 18px; margin: 0 26px; }
.kin .it svg { font-size: 54px; color: var(--blue); }
.check { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 26px 16px 18px; border-radius: 16px; white-space: nowrap;
         background: rgba(6,33,62,.86); color: #fff; font: 600 28px "Inter"; box-shadow: 0 20px 60px rgba(4,27,52,.35), inset 0 0 0 1px rgba(255,255,255,.14); }
.check .ok { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); display: grid; place-items: center; font-size: 22px; color: #fff; }
.streak { position: absolute; top: -40%; width: 260px; height: 180%; transform: rotate(18deg); filter: blur(18px);
          background: linear-gradient(90deg, rgba(5,218,240,0), rgba(5,218,240,.55), rgba(0,143,241,.35), rgba(0,143,241,0)); mix-blend-mode: screen; }
.halo { position: absolute; border-radius: 34px; pointer-events: none;
        background: conic-gradient(from 0deg, rgba(5,218,240,.0), rgba(5,218,240,.75), rgba(0,143,241,.85), rgba(0,120,248,.25), rgba(5,218,240,.0)); filter: blur(28px); }
.mailcard { position: absolute; width: 560px; padding: 22px 26px; border-radius: 22px; background: rgba(255,255,255,.92); color: var(--ink);
            box-shadow: 0 40px 100px rgba(4,27,52,.28), inset 0 0 0 1px rgba(223,233,244,.9); font-family: "Inter"; }
.mailcard .from { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--muted); }
.mailcard .from i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, #04b6f2, #0078f8); color: #fff; font-style: normal; font-size: 20px; }
.mailcard h4 { font-size: 20px; margin: 12px 0 6px; }
.mailcard p { font-size: 16px; color: #3b5576; line-height: 1.5; }
.mailcard .code { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 12px; background: #eef6ff; font: 700 38px "InterDisplay"; letter-spacing: .18em; color: var(--blue); }
.toast { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-radius: 16px; background: #fff; color: #126b4c; font: 600 22px "Inter";
         box-shadow: 0 24px 70px rgba(4,27,52,.25), inset 0 0 0 1px #c9ecdc; white-space: nowrap; }
.toast i { width: 34px; height: 34px; border-radius: 50%; background: #129266; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 20px; }
.digits { position: absolute; left: 0; right: 0; text-align: center; font: 700 220px "InterDisplay"; letter-spacing: -0.04em; color: #fff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
